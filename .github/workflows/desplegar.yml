# Despliegue continuo de apustore-ec.com.
#
# Cada push a main valida, compila y publica el sitio en el hosting cPanel por SSH.
# El servidor solo recibe el dist/ ya compilado: allá no hay Node ni npm.
#
# El hosting es una cuenta compartida (usuario `rivetecc`) que aloja otros doce
# dominios de clientes. Por eso el despliegue apunta SIEMPRE a un subdirectorio
# explícito y nunca al home: un rsync con --delete sobre el home borraría el resto.

name: Desplegar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desplegar-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION_NODE: '22'
  DOMINIO: apustore-ec.com
  # Vite sustituye las VITE_* al compilar, no las lee al ejecutarse. Ninguna es
  # secreta —todas acaban dentro del bundle, que cualquiera puede leer—, así que
  # las direcciones van escritas aquí. Solo el token pasa por Secrets, para no
  # dejarlo en el repositorio.
  VITE_CMS_BASE_URL: https://erp.mashaec.net/api/cms/apustore
  VITE_ECOMMERCE_BASE_URL: https://erp.mashaec.net/api/ecommerce/apustore
  VITE_ERP_STORAGE_URL: https://erp.mashaec.net/storage

jobs:
  validar:
    name: Validar y compilar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Traer el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.VERSION_NODE }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar el código
        run: npm run lint

      - name: Compilar
        env:
          VITE_CMS_TOKEN: ${{ secrets.APUSTORE_CMS_TOKEN }}
        run: npm run build

      # Un HTML por página, colección y producto con su propio Open Graph. Si el
      # ERP no responde, publica con los textos de src/data/seo.json.
      - name: Prerender de Open Graph
        env:
          VITE_CMS_TOKEN: ${{ secrets.APUSTORE_CMS_TOKEN }}
        run: npm run prerender

      - name: Comprobar que el build sirve
        run: |
          test -f dist/index.html || { echo "::error::El build no generó index.html"; exit 1; }

          # Sin .htaccess, Apache no reescribe las rutas: /producto/algo daría 404
          # al recargar y nadie entregaría los HTML con Open Graph propio.
          test -f dist/.htaccess || { echo "::error::Falta dist/.htaccess: las rutas internas darán 404"; exit 1; }
          test -d dist/_paginas  || { echo "::error::Falta dist/_paginas: el prerender no escribió"; exit 1; }

          # Que compile no basta: sin las VITE_* el build pasa igual y el sitio
          # se publica sin datos. Se comprueba que la dirección quedó dentro.
          grep -rq "erp.mashaec.net" dist/assets/*.js \
            || { echo "::error::El bundle no lleva la URL del ERP: ¿faltan las VITE_*?"; exit 1; }

          echo "Peso del sitio: $(du -sh dist | cut -f1)"

      - name: Guardar el resultado
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sitio
          path: dist/
          include-hidden-files: true   # sin esto el .htaccess no viaja
          retention-days: 5

  desplegar:
    name: Publicar en el hosting
    needs: validar
    runs-on: ubuntu-latest
    timeout-minutes: 10

    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'Alej1405/apustore-fron'

    environment:
      name: produccion
      url: https://apustore-ec.com

    steps:
      - name: Recuperar el sitio compilado
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sitio
          path: dist

      - name: Comprobar que los secretos del servidor llegaron
        # Cada secreto va en su propia variable: APUSTORE_KNOWN_HOSTS tiene varias
        # líneas, y leerlos todos juntos línea por línea partía esa huella en
        # pedazos que parecían secretos vacíos.
        env:
          APUSTORE_HOST: ${{ secrets.APUSTORE_HOST }}
          APUSTORE_USUARIO: ${{ secrets.APUSTORE_USUARIO }}
          APUSTORE_KNOWN_HOSTS: ${{ secrets.APUSTORE_KNOWN_HOSTS }}
          APUSTORE_SSH_KEY: ${{ secrets.APUSTORE_SSH_KEY }}
        run: |
          faltan=0
          for nombre in APUSTORE_HOST APUSTORE_USUARIO APUSTORE_KNOWN_HOSTS APUSTORE_SSH_KEY; do
            if [ -z "${!nombre}" ]; then echo "::error::Falta el secreto $nombre"; faltan=1; fi
          done
          [ "$faltan" -eq 0 ] \
            || { echo "::error::Sin estos secretos el rsync falla con 'Permission denied', que parece un problema del servidor y no lo es."; exit 1; }
          echo "Los 4 secretos del servidor tienen valor."

      # El secreto acepta la clave de dos formas: en base64 de una sola línea
      # (base64 < ~/.ssh/despliegue_linkcargo | tr -d '\n' | pbcopy) o pegada tal
      # cual, con sus líneas BEGIN/END. Se limpian espacios y saltos que mete el
      # copiar y pegar, que es lo que rompía "base64 -d" con "invalid input".
      - name: Preparar el acceso SSH
        env:
          CLAVE: ${{ secrets.APUSTORE_SSH_KEY }}
          HUELLAS: ${{ secrets.APUSTORE_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if printf '%s' "$CLAVE" | grep -q 'BEGIN OPENSSH PRIVATE KEY'; then
            printf '%s\n' "$CLAVE" | tr -d '\r' > ~/.ssh/despliegue
          else
            printf '%s' "$CLAVE" | tr -d ' \n\r\t' | base64 -d > ~/.ssh/despliegue 2>/dev/null \
              || { echo "::error::APUSTORE_SSH_KEY no es la llave: no es base64 ni una clave OpenSSH. ¿Se pegó otro valor (por ejemplo el token)? Vuelve a copiarla."; exit 1; }
          fi
          chmod 600 ~/.ssh/despliegue
          printf '%s\n' "$HUELLAS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/despliegue > /dev/null \
            || { echo "::error::APUSTORE_SSH_KEY no es una clave válida. Vuelve a copiarla."; exit 1; }

      # --delete deja el servidor idéntico al build, pero .well-known guarda el
      # reto de Let's Encrypt (si se borra, la renovación del SSL falla) y
      # cgi-bin lo crea cPanel.
      - name: Subir el sitio
        env:
          DESTINO: ${{ secrets.APUSTORE_USUARIO }}@${{ secrets.APUSTORE_HOST }}
        run: |
          rsync -rlptz --delete --checksum --chmod=D755,F644 \
            --exclude='.well-known' --exclude='cgi-bin' \
            -e "ssh -i ~/.ssh/despliegue -p ${{ secrets.APUSTORE_PUERTO || 22 }} -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            dist/ "$DESTINO:${{ env.DOMINIO }}/"

      - name: Borrar la clave del runner
        if: always()
        run: rm -f ~/.ssh/despliegue

      - name: Comprobar que el sitio responde
        run: |
          for intento in 1 2 3; do
            codigo=$(curl -sS -o /dev/null -w '%{http_code}' "https://${{ env.DOMINIO }}" || echo 000)
            [ "$codigo" = "200" ] && { echo "El sitio responde 200"; exit 0; }
            echo "Intento $intento: HTTP $codigo. Reintento en 10 s."
            sleep 10
          done
          echo "::error::El sitio no respondió 200 después del despliegue"
          exit 1
